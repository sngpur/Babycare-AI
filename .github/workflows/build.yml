name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract and Organize Project Files
        run: |
          unzip Project.zip
          find . -maxdepth 2 ! -name '.' ! -name '.github' -exec cp -r {}/. . \; 2>/dev/null || true
          
          mkdir -p .github/gradle_home
          
          # Recreate signature files
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p app
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # Disable google-services plugin check completely to prevent package name mismatch error
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/alias(libs.plugins.google.services)/\/\/ alias(libs.plugins.google.services)/g' app/build.gradle.kts
            sed -i 's/googleServices {/googleServices { missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN/g' app/build.gradle.kts
          fi

          chmod -R 777 .

      - name: Generate Gradle Wrapper & Build APK
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.github/gradle_home
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: my-market-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
